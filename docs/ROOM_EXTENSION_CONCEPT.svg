<title id="title">Behind the Build — proposed extension</title>
<desc id="desc">Schematic of four wall clocks above the desk, a bookcase on the right-hand wall with a green Mustang and miniature bicycle, and an iPhone on the right desk holder. Three clock styles are compared below. This is a proposal, not an implemented room render.</desc>
