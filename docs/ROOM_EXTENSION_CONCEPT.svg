  <text x="648" y="910" class="body">Warm-white case.</text>
  <text x="648" y="937" class="body">Braun-inspired restraint.</text>
  <text x="511" y="999" class="small">Pairs well with the existing yellow alarm clock.</text>
</g>
<g>
