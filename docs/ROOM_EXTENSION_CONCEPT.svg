  <g transform="translate(122 903) scale(1.45)"><use href="#clock"/></g>
  <text x="198" y="879" font-size="19" font-weight="600">Quiet and readable</text>
  <text x="198" y="910" class="body">Ivory face, slim graphite rim.</text>
  <text x="198" y="937" class="body">Best balance with the desk.</text>
  <text x="66" y="999" class="small">Four matching city plaques beneath the clock row.</text>
</g>
