<path d="M960 160V698" stroke="#d6d9ca"/>
<text x="996" y="184" class="label">THE RECOMMENDED SET</text>
<text x="996" y="224" font-size="22" font-weight="600">01 / Useful wall clocks</text>
<text x="996" y="251" class="body">Station faces. Live city times.</text>
<text x="996" y="275" class="body">One quiet, consistent family.</text>
<text x="996" y="331" font-size="22" font-weight="600">02 / Right-hand library</text>
<text x="996" y="358" class="body">Oak shelves, graphite frame.</text>
<text x="996" y="382" class="body">Keep the corner visibly open.</text>
<text x="996" y="438" font-size="22" font-weight="600">03 / A small collection</text>
<text x="996" y="465" class="body">Cream road bicycle.</text>
<text x="996" y="489" class="body">Forest-green Mustang Fastback.</text>
<text x="996" y="545" font-size="22" font-weight="600">04 / Working desk details</text>
<text x="996" y="572" class="body">iPhone 16 + Safari viewport lab.</text>
<text x="996" y="596" class="body">MacBook opens physically 110°.</text>
<text x="996" y="620" class="body">Proper key shapes and lettering.</text>
<text x="996" y="680" class="small">Defaults proposed for Opus 5.5 to implement.</text>

<text x="44" y="770" class="label">CLOCK STYLES / CHOOSE ONE FAMILY</text>
