  <text x="1030" y="923" text-anchor="middle" font-size="10" style="fill:#b4bfa6">ISTANBUL</text>
  <text x="1124" y="879" font-size="19" font-weight="600">More technical</text>
  <text x="1124" y="910" class="body">Compact HH:MM.</text>
  <text x="1124" y="937" class="body">No flip animation.</text>
  <text x="956" y="999" class="small">Use low brightness so screens remain the focal point.</text>
