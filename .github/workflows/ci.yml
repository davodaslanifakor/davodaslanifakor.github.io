name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.14.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test --maxWorkers=4
      - run: pnpm build
      - run: pnpm generate
      - run: pnpm verify:pages
      - run: pnpm exec playwright install --with-deps chromium webkit
      - run: pnpm test:e2e --workers=1
        env:
          PORTFOLIO_E2E_STATIC: '1'
